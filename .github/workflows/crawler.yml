name: Knowledge Fountain (지식샘터) Enrolled Count Crawler

on:
  schedule:
    # 매 6시간마다 정기 실행 (00:00, 06:00, 12:00, 18:00 UTC)
    # 한국 시간 기준(KST, UTC+9): 09:00, 15:00, 21:00, 03:00
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동으로 'Run workflow' 즉시 실행 가능

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 firebase-admin

      - name: Run Crawler Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python crawler.py
